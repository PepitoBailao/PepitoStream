version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pepito_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-pepito}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pepito123}
      POSTGRES_DB: ${DB_NAME:-pepitostream}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pepito}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pepito_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pepito_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pepito_network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pepito_backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-pepito}:${DB_PASSWORD:-pepito123}@postgres:5432/${DB_NAME:-pepitostream}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      API_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    networks:
      - pepito_network
    restart: unless-stopped

  # Frontend (optional, for development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pepito_frontend
    ports:
      - "3001:3000"
    environment:
      VITE_API_URL: http://backend:3000
    depends_on:
      - backend
    networks:
      - pepito_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: pepito_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - pepito_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  pepito_network:
    driver: bridge