openapi: 3.0.0
info:
  title: PepitoStream API
  description: Advanced streaming content aggregator with smart source selection
  version: 1.0.0
  contact:
    name: PepitoStream Team
  license:
    name: MIT

servers:
  - url: http://localhost:3000/api
    description: Development server
  - url: https://api.pepitostream.com
    description: Production server

paths:
  /health:
    get:
      summary: Health check
      tags:
        - System
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number

  /search:
    get:
      summary: Search for content
      tags:
        - Content
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
        - name: type
          in: query
          schema:
            type: string
            enum: [MOVIE, TV_SERIES, ANIME]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Content'
                  total:
                    type: integer
        '400':
          description: Bad request
        '429':
          description: Too many requests

  /content/{id}:
    get:
      summary: Get content details
      tags:
        - Content
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Content details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
        '404':
          description: Content not found

  /content/{id}/sources:
    get:
      summary: Get available sources for content
      tags:
        - Content
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: quality
          in: query
          schema:
            type: string
        - name: language
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Available sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Source'

  /auth/register:
    post:
      summary: Register new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - username
                - password
              properties:
                email:
                  type: string
                  format: email
                username:
                  type: string
                  minLength: 3
                password:
                  type: string
                  minLength: 8
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Validation error
        '409':
          description: User already exists

  /auth/login:
    post:
      summary: Login user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  refreshToken:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials

  /auth/me:
    get:
      summary: Get current user
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

  /user/favorites:
    get:
      summary: Get user favorites
      tags:
        - User
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User favorites
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Content'

    post:
      summary: Add to favorites
      tags:
        - User
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contentId
              properties:
                contentId:
                  type: string
      responses:
        '201':
          description: Added to favorites
        '400':
          description: Bad request

  /user/watch-history:
    get:
      summary: Get watch history
      tags:
        - User
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Watch history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WatchHistory'

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        username:
          type: string
        avatar:
          type: string
        role:
          type: string
          enum: [USER, MODERATOR, ADMIN]
        createdAt:
          type: string
          format: date-time

    Content:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
        type:
          type: string
          enum: [MOVIE, TV_SERIES, ANIME]
        description:
          type: string
        image:
          type: string
        rating:
          type: number
        genres:
          type: array
          items:
            type: string
        cast:
          type: array
          items:
            type: string
        releaseDate:
          type: string
          format: date-time
        isAnime:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Source:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
        link:
          type: string
        quality:
          type: string
        language:
          type: string
        isVerified:
          type: boolean
        latency:
          type: integer
        fileSize:
          type: integer
        priority:
          type: integer

    WatchHistory:
      type: object
      properties:
        id:
          type: string
        content:
          $ref: '#/components/schemas/Content'
        watchedAt:
          type: string
          format: date-time
        duration:
          type: integer
        totalDuration:
          type: integer

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

tags:
  - name: System
    description: System health and info
  - name: Content
    description: Search and browse content
  - name: Authentication
    description: User authentication
  - name: User
    description: User profile and preferences